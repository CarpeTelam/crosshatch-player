# tickets.toml — epic-icon-library's agreed stories in build order. tickets.py reads it.

[[entry]]
id = 1
type = "story"
title = "Tracer: a Phosphor icon from SVG to the game canvas"
description = "Vendors four Phosphor 2.1.1 SVGs (regular `x` and `circle` as `mark_x` and `mark_o`, fill `heart` and `dice-six` as `suit_heart` and `die_6`) with Phosphor's licence and the name map (name, source file, weight) in `assets/game-icons/`; adds `scripts/gen_game_icons.py` on `fork_common.py`, writing to the path its `--out` option names (entry 3 runs it that way, unchanged), with a standard-library path rasterizer (absolute and relative M L H V C S Q A Z, nonzero winding) and a standard-library sidecar test, rendering 32 and 64 px bitmaps in `GfxRenderer::drawIcon`'s layout (square, 1 bpp, MSB-first, byte-padded rows, 0 = ink, stored rotated 90° counter-clockwise) into a committed `GameIcons.generated.h` with a name table, a lookup API, and per-name bitmaps entry 6 reaches at compile time; un-ignores the header in `.gitignore`, adds `lib/GameIcons/.clang-format` (`DisableFormat`), narrows AGENTS.md's generated-files line, adds the sidecar test to the ledger's Game paths, and removes the `GameIcons::libraryName()` stub and its `LinksLibraries` check; adds `ch.gfx.icon(name, x, y, size, color)` with an `Icon` display-list op, a pure host-tested blit in `src/games` (large doubles the 64 px bitmap, `white` inks white, clipped) that `FrameReplay` uses, and a `drawGameIcon` helper in `src/games` for screens that takes no `GameScript` type (entry 5 and epic-install-and-launcher's launcher rows use it; entry 6 draws the per-name bitmaps with `renderer.drawIcon`); raises an unknown name through `CallGuard::raise`, with `faults/unknown_icon.lua` and its fixtures README row; appends `fn ch.gfx.icon` and the four `icon` lines with `API_SURFACE_CRC`, and adds `ApiSurfaceTest.IconsMatchTheList`; and adds an `icons` fixture game in `test/game_script/fixtures/`."
verify = "Host tests pass, including the generator's sidecar (a ring's hole case, and two runs byte-identical), the blit, the icon binding with an unknown name under `pcall`, `SessionGameTest`'s every-fault check reaching the README's text for `unknown_icon`, and `IconsMatchTheList`; `x4pro` and `sticky` build; a simulator screenshot of the `icons` fixture shows the four icons at small, medium, and large in black and in white."
covers = ["R1", "R2", "R4", "R6", "R7"]
after = ["2.9", "2.11"]
hitl = false
risk = "medium"
unknown = "Whether the rasterizer's 1-bit threshold at 32 px keeps dice pips, suit points, and the regular weight's 2 px lines legible; the builder picks the threshold that keeps every pip and line visible in the screenshot and records it, and the owner reviews it in entry 8."
references = ["_bmad-output/planning-artifacts/architecture/architecture-crosshatch-player-2026-09-26/ARCHITECTURE-SPINE.md, AD-2, AD-7, AD-19, AD-24, layer table", "_bmad-output/planning-artifacts/architecture/architecture-crosshatch-player-2026-09-26/game-api-seed.md, sections 5 and 6", "_bmad-output/implementation-artifacts/deferred-work.md, spine rules ahead of the code (epic-icon-library)", "docs/crosshatch/fork-scripts.md", "freeink-sdk/libs/assets/Icons/tools/gen_icons.py, for the bitmap layout only", "test/game_script/fixtures/README.md", ".claude/skills/run-crosshatch-player/SKILL.md"]

[[entry]]
id = 2
type = "story"
title = "ch.gfx.image and package images"
description = "Extends `GameAssets` to load each `/.games/<id>/<name>.bmp` except `icon.bmp` (`PngToBmpConverter`'s 62-byte 1-bit header, top-down rows padded to 4 bytes, palette index 0 = black) into its PSRAM block with a name table, through a pure host-tested header parser and within one named 128 KB converted-image constant that epic-install-and-launcher's installer and `pack_game.py` reuse; passes the table to `GameScript` through a port in `BindingContext`, with no new include edge; adds `ch.gfx.image(name, x, y, color)` with an `Image` display-list op and an opaque image blit beside entry 1's (`white` inverted, clipped); raises an unknown name through `CallGuard::raise`, with `faults/unknown_image.lua` and its README row; maps a malformed or over-budget image to a load failure with one appended `STR_GAMES_*` key in `GameMatchActivity.cpp`'s load-failure mapping; appends `fn ch.gfx.image` and the image limits with `API_SURFACE_CRC`; adds an `images` fixture whose `.bmp` files match the converter's layout; and leaves the spine unchanged."
verify = "Host tests pass, including the header parser (valid, truncated, wrong bit depth, over budget), the image binding with an unknown name under `pcall`, the every-fault check for `unknown_image`, and the surface test; simulator screenshots show the `images` fixture's image in black and in white at its native size, and a fixture with a malformed `.bmp` in the load-failure view."
covers = ["R5", "R6", "R7"]
after = [1, "2.1"]
hitl = false
risk = "medium"
unknown = "Whether `PngToBmpConverter` builds on the host; if it does, a host test produces the fixture `.bmp` files from committed PNGs, and otherwise they are committed bytes a test checks against the converter's layout; the builder records which."
references = ["_bmad-output/planning-artifacts/architecture/architecture-crosshatch-player-2026-09-26/ARCHITECTURE-SPINE.md, AD-15, AD-16, AD-24, Consistency Conventions", "lib/PngToBmpConverter/PngToBmpConverter.cpp, writeBmpHeader1bit"]

