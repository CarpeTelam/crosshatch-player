description = "Applies the owner's entry-8 answers to the icon set: renames every library icon to its exact Phosphor 2.1.1 name, kebab-case included (`x`, `circle`, `heart`, `dice-six`, `flag-checkered`, `game-controller`, `waves`, `dot-outline`, ...), with no category prefixes or action names; removes the chess pieces (`crown-cross`, `crown`, `castle-turret`, `horse`, and the originals `pawn` and `bishop`, so `assets/game-icons/original/` goes) and keeps every other icon; vendors each remaining icon in both the regular and the fill weight from the 2.1.1 tarball; extends `names.txt`, `scripts/gen_game_icons.py` and its sidecar test for hyphenated names and two weights per name (C++ identifiers map `-` to `_`, so the Home tile's constant still resolves), and regenerates the committed header; adds an optional sixth argument to `ch.gfx.icon(name, x, y, size, color, weight)`, `\"regular\"` (default) or `\"fill\"`, carried in the `Icon` display-list op and drawn by the blit, with an invalid weight raising like a bad size; raises the icon-data cap test from 48 KiB to 96 KiB; updates `api-level-1.txt` (the `fn` line and one `icon` line per name) and `API_SURFACE_CRC` with `IconsMatchTheList` both ways; renames the icons the pause, error and game-over views and the cover-grid Home tile use; updates `docs/crosshatch/game-icons.md` (one row per Phosphor name, a link to the Phosphor site, attribution), the `icons` fixture (every icon at small, medium and large, in both weights, black and white), and every planning or doc reference to an old name (game-api-seed section 5, the spine's AD-24, first-party-games.md)."
