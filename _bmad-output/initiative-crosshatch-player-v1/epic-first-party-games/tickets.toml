# tickets.toml — epic-first-party-games's agreed stories in build order. tickets.py reads it.
# `touches` and `stays_out` are this epic's own keys: the files an entry may change, and those it must not; a builder that needs a file outside `touches` stops and reports.
# Every entry may also write its plan and its `story-<name>-screenshots/`, append under `## <ref>` in `deferred-work.md`, and keep formatting-only changes from `./bin/clang-format-fix`; none of these counts as a file outside `touches`.
# Verify order (AGENTS.md): host tests and fast checks, then the review. "Host suites" means AGENTS.md's host-test command under `/tmp/crosshatch-hosttest.lock`. The games change no firmware (R2), so entries 1 to 3 run no firmware build; `sim.sh` runs under `/tmp/crosshatch-build.lock`, and CI builds all five envs on the epic PR.
# "The games check" is entry 8's host target (split from entry 1 at its plan checkpoint, 2026-10-04) and `games-check` job (R10). A game's "companion folder" is `test/game_script/first_party/<id>/`: its rounds, its own checks (`checks.lua`), and its dev tools, which leave this repository with `games/<id>/` (R2). The check names no game; game-specific tests live only in companion folders.

[[entry]]
id = 8
type = "story"
title = "The games check"
description = "Split from entry 1 at its plan checkpoint (owner, 2026-10-04): the games check (R10), which names no game, and nothing else. A harness target that finds every `<root>/<id>/` at configure time (`<root>` a CMake cache variable that defaults to `games/`, which may be missing or empty at this entry, so scratch trees stay in the build directory, never in `games/`; the companion root `test/game_script/first_party` a second cache variable), packs each with the real `pack_game.py` at build time, installs it with the real installer, runs the game's own checks from its companion folder's `checks.lua` when it has one, and plays every round under its companion folder's `rounds/` in each declared mode it can play on the host (`solo` and `pass`, logging any other it skips), each round carrying its `settings` and a seed the check gives the game's random source, through the hidden pass flow when the manifest sets `hidden`, drawing every local seat after each step and failing on a pack or load failure, any fault (the 2 M-instruction budget and the frame limits included), a snapshot over 700 B (R9), a round that ends with other winners than its file says, a failing game check, a game with no rounds, or a companion folder with no game. The rounds file, `checks.lua`, and the driver follow the epic Notes Decisions of 2026-10-04 (entry 1's checkpoint: C1 as amended, C2, D1 to D3), and entry 1's approved plan (`story-tracer-the-games-check-and-ultimate-tic-tac-toe-plan.md`, groups 1 and 3) is this entry's starting design. It documents the companion folder (the rounds format and the `checks.lua` interface) in `test/game_script/first_party/README.md`, and adds the `games-check` job to `crosshatch-ci.yml`, listed in `Crosshatch Test Status`'s `needs`."
verify = "Host suites pass, including the games check's own engine tests over scratch trees it writes into the build directory (copies of `fixtures/pass-open/`, `pass-hidden/`, `pass-art/`, and a `math.random` scratch game): red for a game that fails to pack, raises a Lua error, exceeds the instruction budget or a frame limit, grows a snapshot past 700 B (701 B red, 700 B green), ends with other winners, has no rounds, has a companion folder with no game, plays a round in an undeclared mode, or fails its `checks.lua`; green for a declared `nearby` (logged as skipped), a passing `checks.lua` whose checks together exceed 2 M instructions, the hidden flow over `pass-hidden`, settings over `pass-art`, a round whose `steps` is a function of the decoded initial state, and seeds (same seed same draws, another seed different); the production target passes with `games/` missing or empty; a one-off reconfigure with both cache variables at scratch roots in the build directory turns the real target red and green as above (recorded, not committed); the `games-check` job's commands pass once from a fresh clone (or AGENTS.md's `git archive` tree with every submodule); the harness and `scripts/` name no first-party game; every `scripts/*_test.py`, `python3 scripts/check_upstream_touches.py`, and `./bin/clang-format-fix` twice pass."
covers = ["R2", "R9", "R10"]
after = ["3.9", "4.3", "5.13"]
hitl = false
