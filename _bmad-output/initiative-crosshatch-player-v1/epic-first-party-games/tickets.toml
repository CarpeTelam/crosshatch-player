[[entry]]
id = 9
type = "story"
title = "Sudoku digit notes in three bold sets, and the greys swapped"
description = "The owner's 2026-10-05 Decision on Sudoku's digit notes (the later of the two that day): 27 bold 12 × 16 px images in three sets of nine, regenerated by the companion folder's `tools/make_note_images.py` with its own bold glyph bitmaps: G, a grey numeral (the 50% checker inside the glyph) on white; B, a black numeral on white; H, a white numeral on a 50% checker ground. A normal cell draws its notes with G and the focused digit's note with B; a cell SHADE PEERS shades draws its notes with H and the focused digit's note with H drawn `\"white\"` (inverted). The tiles sit inside the cell's grid lines, so `board.draw_grid` stays visible, and the checker in G and H matches the screen's dither phase where each image lands (or the simulator shows a mismatch does not read). `view.lua`'s `draw_mark` and the layout of note slots change to suit; the checks that pin note-image placement, the focus set, and the image count follow. With them, the owner's greys Decision of the same day: a clue cell becomes a black numeral on the `\"light\"` (25%) ground (no longer white on `\"dark\"`), and a cell SHADE PEERS shades gets the `\"dark\"` (50%) ground (no longer `\"light\"`), so the H tiles blend into it in phase; the player's digits in a shaded cell are black on 50%, a clue keeps its light ground there, and the focused digit's copies stay white on black. Dot notes and every other screen stay as built."
