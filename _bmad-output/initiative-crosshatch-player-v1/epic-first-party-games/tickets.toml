[[entry]]
id = 3
type = "story"
title = "Sudoku"
description = "Adds `games/sudoku/` (R1, R4, R5, R8, R9) with entry 1's 9×9 board module copied byte for byte (R3) and a test in the games check that fails when the two copies differ: Sudoku+'s interaction (a cell, then a digit on a 3 × 3 pad; NOTES as dots in the digit's pad position, grey rings with the focused digit's marks and copies black, or as digits from 18 package images, nine grey with the dither baked in and nine black for the focused digit; ERASE; UNDO from a bounded ring in `state`, FILL NOTES as one step; clash marks), the menu panel with HINT, FILL NOTES, CHECK, and the SHADE PEERS, SHOW REMAINING, and notes-style toggles remembered in `ch.store`, elapsed time added up from the moves and shown at the end with the best time per difficulty kept in `ch.store` unless the solve used HINT, and a solved grid ending the round with seat 1 the winner; a bank of puzzles in `puzzles.lua` made and graded offline with crossplay's `SudokuCore` in its four bands (the source commit and seeds recorded in the file), the band a manifest setting, picked at random in `setup` and varied by a random symmetry; a Lua port of crossplay's technique ladder for HINT's step and the answer; a host test checks that every bank puzzle is a valid grid with exactly one solution (by a counter sharing no code with the solver) and that the solver finishes it within the budget; its rounds solve a puzzle at each difficulty and cover notes in both styles, ERASE, UNDO of a cell and of a FILL NOTES, HINT on a wrong digit and on a correct board, CHECK, the toggles, and a rejected move on a clue, and a test shows a second `setup` with another seed deals a different grid."
verify = "Host suites pass, including the games check over `sudoku` (every snapshot within 700 B, no fault in `setup`'s pick and symmetry or in HINT, CHECK, and FILL NOTES on the hardest bank puzzles), the board-module identity test, the bank and solver test, and the second-`setup` test; every `scripts/*_test.py`, `python3 scripts/check_upstream_touches.py`, and `./bin/clang-format-fix` twice pass; simulator screenshots show the Options difficulty row with four bands, a grid with clues, the player's digits, dot notes and digit notes with a focused digit, SHADE PEERS and SHOW REMAINING on, a clash mark, CHECK's strikes, a HINT naming its rule, the menu panel, and the solved end screen with the elapsed and best times."
covers = ["R1", "R2", "R3", "R4", "R5", "R8", "R9"]
after = [1]
hitl = false
risk = "high"
unknown = "How many puzzles per band the bank carries within the 128 KB member and 256 KB Lua-source limits and the 256 KB Lua heap, which holds the bank's strings for the whole match (about 82 B a puzzle); the instruction cost of the Lua solver on the hardest Expert puzzle (if one call cannot hold it, the builder caps Expert at what fits and records it); and how small the note-digit images can be and still read on the panel (about 10 × 14 px in a 14 px slot, the size of Sudoku+'s 13 px numerals). If the plan outgrows one session, the orchestrator splits the solver with HINT and CHECK off as their own entry after it. Assumption: the build session can clone `thisishuey/crossplay` (public; `add_repo` with read access) to run its generator and read its solver."
references = ["https://github.com/thisishuey/crossplay, docs/apps/sudokuplus.md (Playing it, The rail, The MENU panel, Undo, Drawing) and docs/apps/sudoku.md (The ladder, How you play it)", "https://github.com/thisishuey/crossplay, src/apps_local/sudoku/SudokuCore.h and SudokuCore.cpp (solve, grade, hint) and tools_local/sudoku/", "_bmad-output/specs/spec-crosshatch-player/first-party-games.md, Sudoku and Shared board", "_bmad-output/planning-artifacts/architecture/architecture-crosshatch-player-2026-09-26/game-api-seed.md, sections 1 (settings) and 2 (ctx.settings)", "test/game_script/fixtures/pass-art/manifest.json (settings)"]
touches = ["games/sudoku/", "test/game_script/fixtures/rounds/sudoku/", "entry 1's games-check test source (the identity test and the bank test only)"]
stays_out = ["src/**", "lib/**", "docs/crosshatch/api-level-1.txt", "games/ultimate-tic-tac-toe/ (its board module is the copy's source, not changed) and games/battleship/", "test/game_script/harness/ResumeMatchTest.cpp and match.cmake", ".github/workflows/**", "every upstream file"]

