# tickets.toml — epic-first-party-games's agreed stories in build order. tickets.py reads it.
# `touches` and `stays_out` are this epic's own keys: the files an entry may change, and those it must not; a builder that needs a file outside `touches` stops and reports.
# Every entry may also write its plan and its `story-<name>-screenshots/`, append under `## <ref>` in `deferred-work.md`, and keep formatting-only changes from `./bin/clang-format-fix`; none of these counts as a file outside `touches`.
# Verify order (AGENTS.md): host tests and fast checks, then the review. "Host suites" means AGENTS.md's host-test command under `/tmp/crosshatch-hosttest.lock`. The games change no firmware (R2), so entries 1 to 3 run no firmware build; `sim.sh` runs under `/tmp/crosshatch-build.lock`, and CI builds all five envs on the epic PR.
# "The games check" is entry 1's host target and `games-check` job (R10); "rounds" are the scripted rounds it plays, under `test/game_script/fixtures/rounds/<id>/`, never in `games/`.

[[entry]]
id = 1
type = "story"
title = "Tracer: the games check and Ultimate tic-tac-toe"
description = "Adds `games/ultimate-tic-tac-toe/` (R1, R6, R8) with the shared 9×9 board module (R3), which entry 3 copies unchanged, and the games check (R10): a harness target that finds every `<root>/<id>/` at configure time (`<root>` a CMake cache variable that defaults to `games/`, so scratch trees stay in the build directory, never in `games/`), packs each with the real `pack_game.py` at build time, installs it with the real installer, and plays every round under `test/game_script/fixtures/rounds/<id>/` in each mode the manifest declares, each round carrying its `settings` and a seed the check gives the game's random source, through the hidden pass flow when the manifest sets `hidden`, drawing every local seat after each step and failing on a pack or load failure, any fault (the 2 M-instruction budget and the frame limits included), a snapshot over 700 B (R9), a round that ends with other winners than its file says, a game with no rounds, or rounds with no game; it documents the rounds format in `fixtures/README.md`, gives other harness targets the `games/` root as a compile definition (entry 2's resume tests use it), and adds the `games-check` job to `crosshatch-ci.yml`, listed in `Crosshatch Test Status`'s `needs`."
verify = "Host suites pass, including the games check over `ultimate-tic-tac-toe` with a round won by each seat, a drawn round, a forced-board round, and a rejected move; scratch trees in the build directory (not committed) turn the target red for a copy of the game that fails to pack, raises a Lua error, grows a snapshot past 700 B, or loses its rounds folder, and turn it green for scratch rounds over `fixtures/pass-hidden/` (the hidden flow) and `fixtures/pass-art/` (settings and a seed); the `games-check` job's commands pass once from a fresh clone (or AGENTS.md's `git archive` tree with every submodule); every `scripts/*_test.py`, `python3 scripts/check_upstream_touches.py`, and `./bin/clang-format-fix` twice pass; simulator screenshots (`sim.sh build x4pro`) show the package installed from `fs_/games/`, a pass round with the playable small boards highlighted, a won small board, and the Over menu."
covers = ["R1", "R2", "R3", "R6", "R8", "R9", "R10"]
after = ["3.9", "4.3", "5.13"]
hitl = false
risk = "high"
plan_checkpoint = true
unknown = "Whether rounds play best as taps through `input` on the harness's 480 × 800 canvas or as moves through the session with a tap check per game, and whether `SessionGame` or the match harness carries a round; the builder picks the one that exercises `draw` and `input` for every seat. If the check and the game outgrow one session, the orchestrator splits the check off as its own entry first, with a minimal round over `fixtures/pass-open/` copied into a scratch root in the build directory for its test."
references = ["_bmad-output/specs/spec-crosshatch-player/first-party-games.md", "_bmad-output/planning-artifacts/architecture/architecture-crosshatch-player-2026-09-26/game-api-seed.md, sections 1 to 4 and 7", "docs/crosshatch/api-level-1.txt, the limits and icons", "test/game_script/LuaGameFixture.h, SessionGame", "test/game_script/harness/packed_fixtures.cmake and pack_fixtures.py", "test/game_script/harness/PackedFixturesTest.cpp", "test/game_script/fixtures/pass-open/main.lua", "test/game_script/fixtures/README.md", ".github/workflows/crosshatch-ci.yml, crosshatch-test-status", "docs/crosshatch/orchestrated-epics.md, the fresh-clone recipe", ".claude/skills/run-crosshatch-player/SKILL.md"]
touches = ["games/ultimate-tic-tac-toe/", "test/game_script/harness (a new games-check target: its .cmake, test source, and any helper beside pack_fixtures.py)", "test/game_script/fixtures/rounds/ultimate-tic-tac-toe/", "test/game_script/fixtures/README.md (the rounds format)", ".github/workflows/crosshatch-ci.yml (the games-check job and its line in crosshatch-test-status's needs)"]
stays_out = ["src/**", "lib/**", "docs/crosshatch/api-level-1.txt", "test/game_script/harness/CMakeLists.txt (it globs `*.cmake` and `*.sources.cmake`; add files, never change it)", "test/CMakeLists.txt (ledger row 3; the target lives under test/game_script, which is fork-only)", ".github/workflows/ci.yml and every other upstream file", ".github/workflows/crosshatch-release.yml and crosshatch-game-packages.yml", "scripts/pack_game.py and fork_release.py"]

[[entry]]
id = 2
type = "story"
title = "Battleship"
description = "Adds `games/battleship/` (R1, R7, R8, R9): a hidden pass game whose placement runs one seat at a time, each ship a move that keeps the turn (rotate in the seat's `ui`, Random places the remaining ships, Ready passes the turn), then one shot per turn with hit, miss, or sunk shown to the mover before the runtime's hand-off; the firing view draws the target board large with library icons and the seat's own fleet small with `ch.gfx` shapes, each `draw` showing only its seat's fleet and shots, and seat 0 at Over both fleets; its rounds cover a win for each seat, Random placement, and rejected moves; it adds `PassResumeTest` cases, which install `games/battleship/` from entry 1's `games/` root the way the suite installs its fixtures, for a hidden match saved in Paused and a snapshot written mid-turn in Playing, both during placement (R11, `deferred-work.md` `## e5-close` V3, marked resolved)."
verify = "Host suites pass, including the games check over `battleship` (every snapshot within 700 B) and the two new `PassResumeTest` cases, each resuming into the hand-off with the placed ships kept; every `scripts/*_test.py`, `python3 scripts/check_upstream_touches.py`, and `./bin/clang-format-fix` twice pass; simulator screenshots show placement with the rotate, Random, and Ready controls, the hand-off between placements, the firing view with both boards, Result with its banner after a hit, and seat 0 under the Over menu with both fleets."
covers = ["R1", "R2", "R7", "R8", "R9", "R11"]
after = [1]
hitl = false
risk = "high"
unknown = "Where the five placement controls and the two boards fit on 480 × 800 with tap targets a child can hit (about 44 px target cells, about 28 px fleet cells); the builder settles the layout from simulator screenshots, and a layout that cannot fit both boards goes back to the owner before a toggle is built."
