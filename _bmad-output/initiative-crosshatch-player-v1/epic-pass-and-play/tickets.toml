after = [2]
hitl = false
risk = "high"
unknown = "Published frames carry no seat, so the gate may need `FrameBuffers` or `GameVM` to tag a frame with the seat it drew; if one session cannot hold it, the orchestrator splits off the VM's drawn-seat command and the blank frame as their own entry first."
