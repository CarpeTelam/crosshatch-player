[[entry]]
id = 4
type = "story"
title = "The hidden hand-off in the match"
description = "`GameMatchActivity` drives a hidden pass match through entry 2's Result and HandOff states as views inside the match (AD-20): in Result it draws the mover's seat through entry 1's seat interface, discards any move `input` returns, and shows the runtime banner \"Tap to pass to player N\"; a tap pushes the blank hand-off screen (a `FrameReplay` blank frame, the eye-closed library icon at most, no script drawing) with a full refresh; a tap there asks the VM for the next seat's frame, and a canvas gate pushes no frame after the hand-off until that seat's own frame is ready; a new match and each Play again start at HandOff; `GameVM` takes the drawn-seat command and holds a `timer` that falls due in Result or HandOff until the next seat is shown; while the next round starts after Play again, the pause menu shows \"Starting the next round\"; adds the hidden two-player fixture `test/game_script/fixtures/pass-hidden/` (each seat has a private view that `draw` shows only for its own seat) and packs it; completes every exhaustive switch over the match states and events the new states reach (`GameViewIcons.h`'s `forView` and `forOption`, `GameViewIconsTest`'s `ALL_STATES`, and `GameMatchActivity`'s `optionLabel`, `handle`, and render switches); documents the pass states, the banner, and the hand-off in `game-canvas.md`; the renderer and screen doubles it extends name the panel push and text drawing they stand in for, with a test pinning each."
verify = "Host suites pass: a harness `GameMatchTest` over `pass-hidden` records the `displayBuffer` sequence across a turn change, a new match, and Play again (the mover's frame, the blank screen with FULL, the next seat's frame) and never the next seat's canvas before the blank; Paused from Result and HandOff returns there; a move returned in Result never reaches `apply`; a timer due in HandOff arrives after the next seat is shown; an open pass match never enters Result; `python3 scripts/pack_device_run_test.py` passes; `python3 scripts/check_layers.py` passes; `pio run -e x4pro` and `-e default` build and `pio check -e x4pro` passes; simulator screenshots show Result with its banner, the hand-off screen, the next seat, and the Play-again gap's menu; `python3 scripts/check_flash_budget.py`'s four steps (`build on`, `build off`, `compare --limit-kib 250 --ram-limit-bytes 1024`, `objects`), with the delta over the orchestrator's base within 11,152 B flash and 32 B static RAM."
