# tickets.toml — epic-pass-and-play's agreed stories in build order. tickets.py reads it.
# `touches` and `stays_out` are this epic's own keys: the files an entry may change, and those it must not; a builder that needs a file outside `touches` stops and reports.
# Every entry may also write its plan and its `story-<name>-screenshots/`, append under `## <ref>` in `deferred-work.md`, and keep formatting-only changes from `./bin/clang-format-fix`; none of these counts as a file outside `touches`.
# Verify order (AGENTS.md): host tests and fast checks, then the review, then `x4pro` and `default`, `pio check` (with `-e x4pro` for games code), and `sim.sh build x4pro`. "Host suites" means AGENTS.md's host-test command under `/tmp/crosshatch-hosttest.lock`; firmware builds run under `/tmp/crosshatch-build.lock`. CI builds all five envs on the epic PR.

[[entry]]
id = 1
type = "story"
title = "Tracer: an open pass match from the picker to game over"
description = "`GameMatchActivity` takes a `GameCore::Roster` (mode and `n`), which today's `GameModeActivity` and the launcher's direct start pass in (pass with `n` = 2, solo as today), and `GameVM` builds the `Session` from it instead of `Roster::solo()`; `Session` and the round driver (`lib/GameScript/SoloRounds`, generalised or with a sibling) serve any `localSeats` subset through a seat-taking interface that entry 4 consumes: `input` and `draw` for a seat the caller names, a move kept only from the turn seat and discarded otherwise, a step that applies a move without drawing, or draws only the seat its caller passes (never `status.turn` on its own), so `GameVM` chooses the seat drawn after a move and entry 4 can draw the mover in Result without touching the round driver, a `timer` delivered to the turn seat, `over` delivered once to each local seat with its own `ui`, and, in pass, seat 0 for `draw` and `input` after the round ends (with one local seat, that seat throughout, for epic-play-nearby); a pure `GameCore` function answers the seat a pass or one-local-seat match draws in Playing and Over, which entry 2 extends to Result and HandOff. `gameHostCaps()` sets `pass` true, and `GameHostCapsTest`, `HostCapsScript.h`, and `list_stubs/GameHostCapsDouble.cpp` follow it, with a test that pins the double's defaults to the device's values. A pass match writes no `resume.bin` yet (skipped with a log line; entry 9 turns it on), so a pass state never reaches a solo Continue. Adds the open fixture `test/game_script/fixtures/pass-open/` (modes `solo` and `pass`, seats 1 to 2, so the picker opens and a 2-seat pass match is the third tap; with one seat that seat plays every turn; a winner and a draw, a move `apply` rejects, and a `timer`) and packs it in `scripts/pack_device_run.py`, and records its own flash and static-RAM delta over the orchestrator's base measurement in its plan."
verify = "Host suites pass, including `SessionTest`, the round driver's tests, and the seat function's table test at n = 2 and n = 3 in pass and with a 2-seat roster that has one local seat, a step that draws a seat other than `status.turn`, a `timer` reaching the turn seat, `SoloRoundsTest`'s solo cases unchanged, and a harness match of `pass-open` that alternates seats, discards an out-of-turn move, delivers `over` once per seat, and then draws seat 0; `python3 scripts/pack_device_run_test.py` and every other `scripts/*_test.py` pass; `python3 scripts/check_layers.py` passes; `pio run -e x4pro` and `-e default` build and `pio check -e x4pro` passes; simulator screenshots (`sim.sh build x4pro`) show `pass-open` started from Home in 3 taps (Games, the game, Pass), both seats' turns, and seat 0 under the Over menu; `python3 scripts/check_flash_budget.py`'s four steps (`build on`, `build off`, `compare --limit-kib 250 --ram-limit-bytes 1024`, `objects`), with the delta over the orchestrator's base within 11,152 B flash and 32 B static RAM."
