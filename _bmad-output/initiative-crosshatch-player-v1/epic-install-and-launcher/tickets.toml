[[entry]]
id = 6
type = "story"
title = "Package hardening"
description = "Completes R2 in `GamePackageInstaller`. It rejects a zip bomb (the declared inflated size checked before extracting, and the streamed output capped at it), path traversal and every non-whitelisted name (folders, `/`, a backslash, `..`, duplicates, `.bmp`), a binary chunk (a `.lua` that starts with Lua bytecode's ESC byte), a member, image total, or package over entry 3's limits, a ZIP64 or other compression method, a CRC mismatch over the streamed output (through `mz_crc32`, with the `src/games` to `lib/miniz` edge added to the spine's layer table and `check_layers.py` in the same commit), and an EOCD entry count that differs from the enumerated count. It reads the EOCD and central directory with a pure host-tested parser, because `ZipFile` keeps its count private and checks no CRC; `ZipFile` is unchanged. Each rejection renames the file `.bad` with its own appended `STR_GAMES_*` reason, mapped in the installer, and leaves `/.games/` and `/.games-data/` untouched. It deletes a leftover `/.games-tmp/` when Games opens. It adds the package limits to `docs/crosshatch/api-level-1.txt` as `limit` lines with `API_SURFACE_CRC` and the level-1 tests, plus a C++ test that checks the constants against entry 2's `package_vectors.json`. It generates its crafted packages with a Python script under `test/game_script/harness/`, since the firmware's miniz cannot deflate."
verify = "Host suites pass (`cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build/test && ctest --test-dir build/test --output-on-failure -j` under the build lock) with one crafted package per rejection (each ends `.bad` with its reason and leaves `/.games/` and `/.games-data/` untouched), the at-limit and one-over vectors, and the surface and level-1 tests; `pio run -e x4pro` and `-e default` build; `python3 scripts/check_layers.py` passes; one simulator screenshot shows a `.bad` reason."
covers = ["R1", "R2", "R3"]
after = [3]
hitl = false
risk = "high"
unknown = "None known."
