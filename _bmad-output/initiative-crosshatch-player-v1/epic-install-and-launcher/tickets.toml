# tickets.toml — epic-install-and-launcher's agreed stories in build order. tickets.py reads it.
# `touches` and `stays_out` are this epic's own keys: the files an entry may change, and those it must not; a builder that needs a file outside `touches` stops and reports.

[[entry]]
id = 1
type = "story"
title = "src/games harness: storage and renderer doubles"
description = "Adds a host harness under `test/game_script/harness/`: its own `CMakeLists.txt`, reached by one `add_subdirectory` line in `test/game_script/CMakeLists.txt`, that includes every `*.cmake` file in the folder, so each later entry adds its own suite file and never edits a shared list. It provides a `HalStorage` fake that lists folders (`openNextFile`) and injects read failures (start from `test/game_script/save_store_stubs/HalStorage.h`), a PSRAM stub for `HalMemory::allocatePsram`, and a recording `GfxRenderer` double, and it host-builds `src/games/GameAssets.cpp`, `FrameReplay.cpp`, and `GameIconDraw.cpp` unchanged. Its tests pin `_bmad-output/implementation-artifacts/deferred-work.md` `## 3.1` (the `Op::Icon` replay: canvas origin, size, ink, clip), `## 3.2`'s third item (`GameAssets::load` spans and offsets, the pass-2 re-read, the `Op::Image` offset), f27dcefd's image-header read-error path, `## 3.9` (the fill weight through replay), `## e3r-1`'s second item (the pixel budget on the real `FrameReplay::draw`, replacing `GfxBindingsTest`'s `frontBlitFills` copy), and `## e3r-2`'s loader half (`scanFolder` / `readFolder` results, `release()` after a pass-2 failure, the long-name log lines). It marks each closed item `Resolved by entry 1 (<commit>)`, and marks `## 3.10`'s `sim.sh check` item resolved by 6973ec8 (`scripts/sim_sh_test.py`)."
verify = "Host suites pass (`cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build/test && ctest --test-dir build/test --output-on-failure -j` under the build lock), the plan records, for each pinned item, one mutation of the guarded line and the test that fails under it, and `pio run -e x4pro` and `pio run -e default` build."
