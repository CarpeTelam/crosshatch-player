[[entry]]
id = 7
type = "story"
title = "Manifest icon grammar, library check, and the pass capability"
description = "Applies the owner's inception decisions (epic Notes, 2026-09-28) in one commit. `Manifest::parse` takes `icon` in the library's grammar (`[a-z][a-z0-9]*(-[a-z0-9]+)*`, at most 32 characters; `_` is now refused, so `ManifestTest.AcceptsUnderscoreInIcon` changes) and a new optional `icon_weight` key (`regular` by default, or `fill`). `GameCore::HostCaps` gains `pass`, which `src/games/GameHostCaps.cpp` sets false, so `Manifest::check` drops `pass` from the modes this host can start. `api-level-1.txt` gains the `icon_weight` manifest line and the icon grammar, with `API_SURFACE_CRC`, `ManifestKeysMatchTheParser`, and the surface test. The installer rejects an `icon` the library lacks through `GameIcons::find` (outside `GameCore`) with an appended `STR_GAMES_*` reason. `pack_game.py` checks `icon` and `icon_weight` against `assets/game-icons/names.txt`. The spine's AD-15 already records all three (inception architecture update); a malformed `icon_weight` makes the package invalid."
verify = "Host suites pass (`cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build/test && ctest --test-dir build/test --output-on-failure -j` under the build lock), including grammar accept and reject cases, `icon_weight`, a host with `pass` false offering only `solo`, an unknown icon ending `.bad`, and the level-1 tests; `python3 scripts/pack_game_test.py` passes with the new cases; `python3 scripts/check_layers.py` passes; `pio run -e x4pro` and `-e default` build."
