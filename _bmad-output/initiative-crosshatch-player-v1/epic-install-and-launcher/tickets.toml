[[entry]]
id = 2
type = "story"
title = "pack_game.py and the package vectors"
description = "Adds `scripts/pack_game.py` and `scripts/pack_game_test.py` per `docs/crosshatch/fork-scripts.md` (standard library only, `fork_common.py`'s exit contract and `parse_api_level`). `python3 scripts/pack_game.py games/<id> <out_dir>`, run from the repo root, reads `manifest.json` (the only Python reader of it), refuses an `api` outside `API_MIN_LEVEL..API_LEVEL` from `lib/GameCore/ApiLevel.h`, applies R2's member whitelist and limits and R3's image budget from each PNG's IHDR (62 + ceil(w / 32) * 4 * h per image, `icon.png` excluded, at most 32 images), refuses a `.bmp` or any other file, writes `<out_dir>/<id>.cpgame` with members sorted by name and fixed timestamps, prints R4's package hash as the last stdout line (16 lowercase hex digits), and exits 1 on an invalid package and 2 when it cannot run. It commits `test/game_core/package_vectors.json`, holding each limit with a case at the limit and one over (entry 6 checks the C++ constants against it), and a hash vector (a few members and their expected hash) with its packed `.cpgame` beside it, which entry 3 installs. It adds the sidecar to the ledger's Game paths in `docs/crosshatch/upstream-touches.md`. It imports nothing from `scripts/game_codec.py`; if it must, the Lua-literal vector notation moves to its own module in the same commit (retro A3)."
verify = "`python3 scripts/pack_game_test.py` passes, covering every exit code, each limit at the limit and one over, a `.bmp` refused, two runs byte-identical, and a test that runs `scripts/fork_release.py`'s `pack_one` against the real packer in a temporary project; every other `scripts/*_test.py` still passes; `python3 scripts/check_upstream_touches.py` passes (the orchestrator provides the `upstream` remote)."
covers = ["R2", "R3", "R4", "R6"]
after = ["2.4"]
hitl = false
risk = "medium"
unknown = "None known."
