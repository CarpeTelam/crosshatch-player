title = "Fork update source"
description = "Adds `lib/GameCore/ForkRelease.h` with the fork release URL, the asset-name function, and the `-ch.N` parse and compare, tested in `test/game_core` against a shared vector file `test/game_core/fork_version_vectors.json` that entry 7's workflow checks also read, and guarded calls to it in `OtaUpdater.cpp` (ledger row 10) that treat a 404 from releases/latest as `NO_UPDATE`; `OtaUpdater.h` is unchanged."
verify = "The version vectors pass in `test/game_core`; all five envs build; the `x4pro-gh_release` image contains the fork release URL and not upstream's, and the `default` image still contains upstream's."
covers = ["R7"]
after = [1, 2]
hitl = false
risk = "high"
unknown = "Whether `OtaUpdater.cpp`'s current structure lets the guarded calls replace the URL constant and the body of `isUpdateNewer()` without touching anything else."
