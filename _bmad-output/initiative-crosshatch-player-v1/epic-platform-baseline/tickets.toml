[[entry]]
id = 7
type = "story"
title = "Fork release workflow and first release"
description = "Adds the one fork-only `workflow_dispatch` release workflow of AD-25 with a dry-run input (build and checks, no tag), copying `ci.yml`'s toolchain setup as entry 3 does, checking tags and the version line against entry 6's vector file, and packing each `games/<id>/` with `scripts/pack_game.py` from epic-install-and-launcher (with no `games/<id>/` the step needs no script); writes AD-25's upstream-merge dry-run rule beside row 10 in `docs/crosshatch/upstream-touches.md`; after merge the owner disables upstream's release workflows in the Actions tab, adds the `*-ch.*` tag ruleset, and makes the first release."
verify = "After merge, a dry run builds both game envs and passes its image checks; hand-pushing or deleting a `*-ch.*` tag is refused; an X4 Pro on a development build of this branch is offered the first fork release, installs it, and is not offered it again."
covers = ["R7"]
after = [6]
hitl = true
risk = "high"
unknown = "How the workflow reads active workflows' triggers through the API, and whether a tag ruleset on a personal repository can exempt only this workflow; if not, repository admins are the ruleset's only bypass and the workflow still refuses an existing tag."
references = ["_bmad-output/planning-artifacts/architecture/architecture-crosshatch-player-2026-09-26/ARCHITECTURE-SPINE.md, AD-25, Operational envelope", "_bmad-output/planning-artifacts/architecture/architecture-crosshatch-player-2026-09-26/reviews/review-ad25-adversary.md"]

