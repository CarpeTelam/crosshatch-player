# tickets.toml — epic-script-runtime's agreed stories in build order. tickets.py reads it.

[[entry]]
id = 1
type = "story"
title = "Tracer: Home to Games to a Lua frame and a tap"
description = "Makes the guarded changes of ledger rows 4 to 7 (list mode) and adds the first `STR_GAMES_*` keys; adds `GameCore::Manifest::parse` for every AD-15 key (unknown keys ignored) with its `test/game_core` suite; a minimal `GamesListActivity` on `UiListActivity` listing each `/.games/<id>/` whose `manifest.json` parses, by `name`; and a `GameMatchActivity` on `UiAppHost` whose `GameAssets` loads every `*.lua` into one PSRAM blob with a name-to-span table, runs it as a `LuaGame` on the `GameVM` task (core 1, priority 1, 16 KB) with a depth-bounded input queue that drops the oldest event with a log line, keeps its heap in the in-tree arena allocator over one 256 KB block from the `src/games` backend, enters Lua only through the `lua_pcall` trampoline to call `setup` and `draw`, and shows `ch.gfx.clear`, `rect`, and `text` through the front and back frame buffers (frame mutex, `frameGen`) and `FrameReplay` with a full refresh; a tap maps through the X4 Pro `GameViewport` to `input` and redraws. The fixture lives in `test/game_script/fixtures/`, never `games/`. It owns the `test/game_script` build of the GameScript sources that later entries extend."
verify = "In the simulator (`sim.sh build x4pro`, `tap`, `ss`) and on an X4 Pro, Home to Games lists the hand-placed fixture, opening it shows its frame, and a tap changes it; host tests cover `Manifest::parse` and a `LuaGame` `setup` and `draw` through the trampoline; the plan records the flash gate's games-on minus games-off difference (retro AI-9)."
covers = ["R1", "R3", "R4", "R9"]
after = ["1.1", "1.2", "1.4"]
hitl = true
risk = "high"
unknown = "How the simulator backs the `GameVM` task (`xTaskCreatePinnedToCore`) and the PSRAM block; host tests back the arena with a `malloc`'d block."
references = ["_bmad-output/planning-artifacts/architecture/architecture-crosshatch-player-2026-09-26/ARCHITECTURE-SPINE.md, AD-2, AD-3 rows 2 and 4 to 7, AD-5, AD-6, AD-7, AD-15, AD-22", "docs/contributing/touch-and-ui.md", ".claude/skills/run-crosshatch-player/SKILL.md", "_bmad-output/initiative-crosshatch-player-v1/epic-platform-baseline/epic-platform-baseline-retrospective.md, AI-9"]

