[[entry]]
id = 3
type = "story"
title = "Static RAM and static-initializer gates"
description = "Extends `scripts/check_flash_budget.py` to also compare `.dram0.data` + `.dram0.bss` + `.noinit` from the games-on and games-off x4pro ELFs (toolchain `size -A`) against a 1 KiB limit, and adds a check in the same job that no object from `lib/Game*`, `src/games`, or `src/activities/games` has an `.init_array` entry or a mutable static over 64 B; each prints its measurement for the epic's record."
verify = "Sidecar tests cover each limit at, under, and one over; locally, a scratch 2 KiB mutable global used from code the x4pro image reaches fails the RAM gate, and a scratch object with a static constructor and one with an unreferenced 128 B mutable static fail the object check; the job passes once from a fresh clone."
covers = ["R11"]
after = [2, "1.3"]
hitl = false
risk = "medium"
unknown = "How to find mutable statics over 64 B from object files (`nm -S` over `.data` and `.bss`) without flagging `constexpr` data."
references = ["_bmad-output/planning-artifacts/architecture/architecture-crosshatch-player-2026-09-26/ARCHITECTURE-SPINE.md, AD-2, Operational envelope", "_bmad-output/implementation-artifacts/deferred-work.md, spine rules ahead of the code"]

