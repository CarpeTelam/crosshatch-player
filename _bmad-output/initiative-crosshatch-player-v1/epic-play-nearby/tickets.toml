[[entry]]
id = 7
type = "story"
title = "Shipping and adopting STATE in GameCore"
description = "The match half of the protocol in the mover-applies model (R4, R5's GameCore part, and R6's end-slot reasons: an `ABORT` reason or silence): each device's `Session` stays the authority for its own local seat, as in pass, and after an accepted local move hands the link the whole `STATE {ver, turn, over, winners, snapshot}`; a `STATE` from the peer is adopted, as a mid-match restore through a `Session` call beside `restore` run on the VM task, only when its `ver` is newer (u16 on the wire, compared across its wrap) and the turn in this device's current status is the peer's seat, or seat 1 starts a round (this status is over, or there is no state yet), and the shipped status then gates input and the end of the round; nothing outside `Session` tracks whose turn it is, and adopting happens only between one `input`-to-`apply` cycle and the next (crossplay's refusal to `submit` with a peer state undrained); only the turn holder advances `ver` (and seat 1 at a round start), which runs on through rematches; seat 1 runs `setup` and Play again. The queue policy is GameCore code over injected storage, with no allocator or log (`lib/GameCore` reaches only std, `lib/Memory`, and `lib/JsonParser`): 4 entries, a newer `STATE` replacing a queued one unless that one ends a round (`over`), a frame left unacked when the queue is full, an overflow counter, and the latched end slot (first reason wins). Entry 8 gives it PSRAM storage, the cross-task handoff, and the `LINK` log lines; entry 9 consumes adopted states and entry 15 the end slot. It states the policy in `docs/crosshatch/game-canvas.md`'s Overlays (replacing its \"through the session's queue\" and \"ESP-NOW link pump\" wording) and updates `Session.h`'s `REJECT` comment."
verify = "Host suites pass (Done when 1): over lossy `FakeLink` with a fake `IGameRules`, two sessions, one local seat each, play full rounds to over for many seeds with identical snapshots on both sides, each move applied on its mover's side only, including runs of moves that keep the turn (several `STATE`s in a row from one mover, as Battleship's placement makes) and a round whose first turn is seat 2; a local move made while a turn-passing peer `STATE` is queued is discarded, never applied to the stale state (crossplay's `testSubmittingBeforeTakingDeliveryIsRefused`); an `over` `STATE` followed at once by seat 1's next-round `STATE` brings the other device to Over before the new round; a rejected move stays on its device as the `rejected` event and puts nothing on the link; a `STATE` from a non-peer, with an older `ver`, or while the turn was ours is never adopted; a rematch keeps `ver` rising and a `STATE` across the u16 wrap counts as newer; a 200-match soak over randomly hostile links (loss to 35 %, duplicates to 30 %, jitter) reaches agreement with moves made in every match and frame counts under the plan's bound; a queue holding an `over` `STATE` keeps it and the newest later `STATE`, and when full leaves the next frame unacked, losing nothing; silence and each `ABORT` reason set the end slot once and are never dropped while the consumer is stopped; `SessionTest`'s existing tests unchanged; fast checks and the firmware checks pass."
covers = ["R4", "R5", "R6"]
after = [6]
hitl = false
risk = "high"
unknown = "The shape of `Session`'s mid-match adopt beside `restore` (which today runs only before `start`); it holds no radio fact. If the plan outgrows one session, the orchestrator splits the queue policy and end slot off as their own entry first."
references = ["ARCHITECTURE-SPINE.md, AD-8, AD-9, AD-13 (MOVE, STATE, REJECT, ABORT, `ver`), AD-18 (queues), the Play Nearby turn sequence", "lib/GameCore/Session.{h,cpp}", "scripts/check_layers.py (TABLE, lib/GameCore)", "docs/crosshatch/game-canvas.md, Overlays", "https://github.com/ma-r-s/crossplay/blob/0a1d17f41e1605d3b033d4327c81b3bcfb2ca2ab/src/apps_local/link/LinkSession.h (the three design decisions; submit, takeIncoming)", "https://github.com/ma-r-s/crossplay/blob/0a1d17f41e1605d3b033d4327c81b3bcfb2ca2ab/host-tests/link/test_link.cpp (testSoak, testStaleStateIsIgnored, testSubmittingBeforeTakingDeliveryIsRefused)"]
