# tickets.toml — epic-play-nearby's agreed stories in build order. tickets.py reads it.
# `touches` and `stays_out` are this epic's own keys: the files an entry may change, and those it must not; a builder that needs a file outside `touches` stops and reports.
# Every entry may also write its plan and its `story-<name>-screenshots/`, append under `## <ref>` in `deferred-work.md`, and keep formatting-only changes from `./bin/clang-format-fix`; none of these counts as a file outside `touches`.
# Verify order (AGENTS.md): host tests and fast checks (`scripts/*_test.py`, `python3 scripts/check_upstream_touches.py`, `python3 scripts/check_layers.py`, `./bin/clang-format-fix` twice), then the review, then firmware builds and `pio check`. "Host suites" means AGENTS.md's host-test command under `/tmp/crosshatch-hosttest.lock`; firmware builds, `pio check`, and `sim.sh` run under `/tmp/crosshatch-build.lock`. "Firmware checks" means `pio run -e x4pro` and `-e default`, `pio check` (default and `-e x4pro`), and `scripts/check_flash_budget.py` `build on`, `build off`, `compare`, and `objects`, with the growth over the base Measurement (2026-10-11, `7bfd8991`: +258,048 B flash, +784 B static RAM) within this epic's 9,504 B / 160 B (R15); CI builds all seven envs on the epic PR.
# "The link interface" is `GameCore::ILink` (R1): opaque frames, opaque peer handles, no radio fact. "The `nearby` fixture" is entry 9's `test/game_script/fixtures/nearby/`. Lanes: GameCore and runtime 1 → 2 → 4 → 6 → 7 → 8 → 9 → 10; the radio adapter 5 (after 2); tools 3; games 12; then 11, 13, 14.

