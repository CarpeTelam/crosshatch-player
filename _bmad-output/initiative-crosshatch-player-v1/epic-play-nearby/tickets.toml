description = "`GameCore::ReliableLink` over the link interface (R2): per-direction `seq`, cumulative `ack`, resends at the resend setting (default 400 ms), one lost-peer report at the silence setting (default 10 s), `PING` keepalives, with an `ACK` of the last frame doubling as the keepalive when one is due, resends on their own clock so outgoing acks never starve them (a bug crossplay's `LinkSession` records), unsequenced `ADVERT`, `PING`, `ACK`, and `ABORT` (an `ABORT` reaches the session whatever is still unacked), a newer `STATE` replacing an unacked one except one that ends a round (`over`), and a reliable frame the session has no room for left unacked so the peer's resend delivers it (the backpressure entry 7's queue relies on), while a frame the session refuses by rule is still acked. Time comes from `IClock`."
