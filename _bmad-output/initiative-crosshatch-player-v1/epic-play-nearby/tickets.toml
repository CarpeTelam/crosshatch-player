[[entry]]
id = 6
type = "story"
title = "Lobby handshake in GameCore"
description = "The lobby protocol over `ReliableLink` (R3): the host's lobby (a `session` id from `IRandom`, `ADVERT` with the host label it is given, seats by `JOIN` arrival, `ABORT(version_mismatch)` and `ABORT(full)`, a joined guest's cancel or silence freeing its seat, Start with at least 2 seats sending `ACCEPT {seat, n}` and stopping `ADVERT`), the guest's (the hosts heard for its game, each joinable or a different version, join, wait, the host's cancel or silence reported, cancel), `ABORT(left)` on a cancel, and the roster and `ctx.api` a started lobby hands to the match. Entry 10's screens drive it; entry 8's `NearbySession` carries it."
