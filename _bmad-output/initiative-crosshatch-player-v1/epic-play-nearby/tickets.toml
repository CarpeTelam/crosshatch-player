[[entry]]
id = 5
type = "story"
title = "ESP-NOW link adapter and the Nearby precondition probe"
description = "The radio adapter (R7): `src/games` `EspNowLink` implements the link interface over ESP-NOW v2, channel 1, no encryption, in AD-18's bring-up order on the STA interface (`esp_now_init` is its `ESP_NOW.begin` step), hardened as crossplay's `LinkRadio::begin` is (R7: auto-reconnect off before the disconnect, the disconnect waited out before the channel is set, the broadcast peer registered, teardown flagged once `esp_now_init` succeeds, `end()` idempotent, modem power save with a 50 ms wake window), its receive callback only copying frames into a ring buffer (a radio-free `src/games/FrameRing.h`, so the harness can test it), and its peer table, both allocated in PSRAM at bring-up (internal heap needs the owner: SPEC Constraints); teardown leaves the radio off; it maps MAC addresses to opaque peer handles and exposes the host label built from the last two MAC bytes (R8). A precondition probe is a pure, header-only decision over given readings (Wi-Fi mode, free internal heap) plus a device reader kept out of the harness, so entry 10's lobby takes the decision and its tests pass a fake reading. Entry 11 hands `EspNowLink` to `NearbySession` and the label to the lobby. Both are compiled out under `SIMULATOR` and kept out of the host harness. It measures the ESP-NOW driver's flash and IRAM cost first, this epic's largest unknown."
verify = "Host suites pass, with tests of the ring buffer (copy only, overflow counted, never blocking) and of the probe's decision (Wi-Fi off and on, heap at 102,399 B and 102,400 B); a failure injected at each bring-up step leaves ESP-NOW down and the next bring-up succeeds (a seam the plan names); `pio run -e x4pro`, `-e default`, and `-e sticky` build; `sim.sh build x4pro` builds with both compiled out; a `static_assert` in `EspNowLink` holds `Protocol`'s maximum frame within `ESP_NOW_MAX_DATA_LEN_V2`; fast checks and `pio check -e x4pro` pass; the driver's flash and static-RAM cost is measured with `scripts/check_flash_budget.py` in a scratch build that references `EspNowLink` (nothing calls it until entry 11) and recorded in the plan, and a cost over half the share (4,752 B flash or 80 B static RAM) stops for the owner."
covers = ["R7"]
after = [2]
hitl = false
risk = "high"
unknown = "What linking ESP-NOW costs in flash and in `.iram0` static RAM against 9,504 B / 160 B (6,928 B and 32 B spare after the reserve); whether a Wi-Fi-task callback may write PSRAM safely on the S3 (if not, the owner decides on internal heap); whether the 50 ms wake window works without `CONFIG_ESP_WIFI_STA_DISCONNECTED_PM_ENABLE`, which this fork does not set and which would widen ledger row 1 (if it needs it, stop for the owner)."
references = ["ARCHITECTURE-SPINE.md, AD-2, AD-18, Stack (ESP-NOW v2)", "_bmad-output/specs/spec-crosshatch-player/SPEC.md, Constraints (internal-RAM costs)", "scripts/check_layers.py (RADIO_CRYPTO)", "freeink-sdk/libs/network/NearbyTransfer/src/NearbyTransfer.cpp (EspNowTransport::begin, a reading reference; not linked)", "lib/hal/HalMemory.h (getInternalHeap)", "src/activities/network/CrossPointWebServerActivity.cpp (the `WiFi.getMode() != WIFI_MODE_NULL` idiom)", "https://github.com/ma-r-s/crossplay/blob/0a1d17f41e1605d3b033d4327c81b3bcfb2ca2ab/src/apps_local/link/LinkRadio.cpp (begin, end, send)"]
