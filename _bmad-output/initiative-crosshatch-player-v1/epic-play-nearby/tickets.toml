[[entry]]
id = 7
type = "story"
title = "Match messages, the session queue, and endings in GameCore"
description = "The match half of the protocol (R4, R5, R6's GameCore part): the host applies a guest's `MOVE` for the seat its peer handle holds when the shipped turn is that seat and answers `STATE` or `REJECT`; the guest applies only a newer `STATE`, gates on the shipped status, holds further moves, and turns `REJECT` into the `rejected` event; `ver` runs on through rematches; the 4-deep session queue coalesces `STATE` and leaves a `MOVE` or `REJECT` unacked when full, with one `LINK` line per overflow; a lost peer and a received `ABORT` set the latched end slot (first reason wins). It states the queue policy in `docs/crosshatch/game-canvas.md`'s Overlays."
verify = "Host suites pass (Done when 1): over lossy `FakeLink` with a fake `IGameRules`, a host and a guest session play full rounds to over for many seeds with identical snapshots on both sides, a rejected guest move reaches the guest's input, a move out of turn or from a seat the peer does not hold is never applied, a rematch keeps `ver` rising, a full queue loses no move (delivered on a resend) and keeps only the newest `STATE`, silence and each `ABORT` reason set the end slot once and are never dropped while the consumer is stopped; `SessionTest`'s existing tests unchanged; fast checks and the firmware checks pass."
covers = ["R4", "R5", "R6"]
after = [1, 6, "epic-pass-and-play"]
hitl = false
risk = "high"
