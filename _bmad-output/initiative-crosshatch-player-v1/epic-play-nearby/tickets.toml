[[entry]]
id = 8
type = "story"
title = "GameLink task and NearbySession over the link interface"
description = "`src/games` `NearbySession` owns a link it is handed through the link interface (`EspNowLink` on the device from entry 11, `UdpLink` in the simulator from entry 16, `FakeLink` in the harness), `ReliableLink`, entry 6's lobby and entry 7's match sessions, the session queue's PSRAM entries and the cross-task handoff to the VM task, the end slot the match reads, and the `GameLink` task (priority 1, core 1, 4 KB stack) that drains the link and runs the resends and the silence check (R5, R7); it never takes `RenderLock` or touches activity state, and its teardown brings the link down. It gives the match one call to end with an `ABORT` reason: either flush the unacked frames until a deadline and then send the `ABORT` three times, or send it three times at once (crossplay's `Bye`), which entry 15 uses for Leave (at most 800 ms), the forced exit, and a script error. It writes the `LINK` lines R13 names (each naming the `session` id; `STATE` lines its `ver`; resends, queue overflows with their count, silence, and `ABORT`s sent and received). It owns the harness `*.sources.cmake` that compiles the new GameCore sources for the harness suites entries 9, 15, and 10 reuse, adding only what entries 6 and 7 did not already list, so no source is listed twice. Entry 9 moves it into the match; entry 10's lobby creates it."
