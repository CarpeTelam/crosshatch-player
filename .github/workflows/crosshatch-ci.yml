# Fork-only CI for crosshatch-player, beside upstream's ci.yml (which the fork does not edit, so its Test Status
# cannot wait on these jobs). Branch protection requires only the Crosshatch Test Status job below; add any new
# fork-only check as a job here and list it in that job's needs, and no branch protection change is needed.
#
# - Upstream touch ledger: keeps changes to upstream files within docs/crosshatch/upstream-touches.md so merges
#   of crosspoint-reader's develop branch stay clean. That file has the rules and how to run the check locally.
# - x4pro flash budget: caps the flash and the static internal RAM the game runtime adds to the X4 Pro firmware.
#   Builds x4pro on the PR's commit with FREEINK_CAP_GAMES on (the normal env) and off, and fails when the image
#   with games is more than the flash limit larger, or its .dram0.data + .dram0.bss + .noinit + .iram0.* sections
#   more than the RAM limit larger (IRAM shares internal SRAM on the S3). Both builds come from the same commit, so
#   upstream growth never uses up the budget. It also fails a game object (lib/Game*, src/games,
#   src/activities/games) with a static initializer or a mutable static over 64 B (spine AD-2).
#   scripts/check_flash_budget.py holds the logic and how to run it locally.
# - x4pro static analysis: runs pio check (cppcheck) on the x4pro env with the flags of ci.yml's cppcheck job. That
#   job checks only the C3 default env, which leaves FREEINK_CAP_GAMES off, so it never analyzes the game code.
#   Run it locally with the same command (AGENTS.md); scripts/dev_setup.py installs libpcre3, which cppcheck needs.
# - Simulator build: builds the desktop simulator for the X4 Pro and the Sticky, both of which turn FREEINK_CAP_GAMES
#   on, so game code that only builds on the device fails here and not in a later session. Device-only files guard
#   themselves with !defined(SIMULATOR); .claude/skills/run-crosshatch-player/ has the simulator and how to run it.
# - Fork script tests: runs every scripts/*_test.py, the sidecar tests of the fork's scripts, including those of the
#   release workflow's script, which otherwise runs only when dispatched. A regression that made a check always pass
#   would go unnoticed on compliant PRs, and so does a file that runs no test (its log has no "Ran <n>" line with
#   n > 0, as when unittest.main() is missing). scripts/sim_sh_test.py also tests the simulator skill's sim.sh setup
#   and check on scratch repositories. docs/crosshatch/fork-scripts.md has the script conventions.
# - Game packages is not here: it runs only on a labelled pull request, from crosshatch-game-packages.yml, so a label
#   event never reruns these jobs.
# - API freeze: fails a PR that changes a frozen game API level's docs/crosshatch/api-level-<n>.txt against the
#   merge-base with develop, or turns lib/GameCore/ApiLevel.h's API_LEVEL_FROZEN from true to false (spine AD-19).
#   scripts/check_api_freeze.py holds the rule and how to run it locally.
# - Layer check: fails an #include edge of the game code (lib/GameCore, lib/GameIcons, lib/GameScript, src/games,
#   src/activities/games) that the spine's layer table does not allow, any other source file that includes
#   lib/GameScript or lib/lua, and a Screens file that names GameScript (retro AI-5). scripts/check_layers.py holds
#   the table as data and how to run it locally.
# - Icons up to date: runs scripts/gen_game_icons.py, unchanged, to a scratch file and fails when the result differs
#   by any byte from the committed lib/GameIcons/GameIcons.generated.h or from the host tests' reference
#   test/game_script/GameIconsRaw.h (--raw-out; neither is edited by hand; spine AD-2, AD-24), or
#   when the generator itself fails; each failure is annotated. Only its exit 3, the SVGs and
#   assets/game-icons/SHA256SUMS disagreeing, gets re-pin advice; any other exit is annotated with its code.
#   Fix a failure with python3 scripts/gen_game_icons.py --raw-out test/game_script/GameIconsRaw.h on Linux and commit
#   both files (after a deliberate change of source, --write-sums first); the script's docstring has the exit codes
#   and the rest.
name: Crosshatch CI

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: crosshatch-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  upstream-ledger:
    name: Upstream touch ledger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the check compares from the merge-base with upstream. The submodule itself is not
      # needed; only its recorded pointer is compared.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream develop
        run: |
          git remote add upstream https://github.com/crosspoint-reader/crosspoint-reader.git
          start=$SECONDS
          git fetch --no-tags upstream +refs/heads/develop:refs/remotes/upstream/develop
          echo "Fetched upstream/develop in $((SECONDS - start)) s"

      # The merge driver matches the documented upstream merge, where .gitattributes keeps our AGENTS.md.
      - name: Check the ledger and trial-merge upstream
        run: |
          git config merge.ours.driver true
          python3 scripts/check_upstream_touches.py

  flash-budget:
    name: x4pro flash budget
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Limit in KiB, 1 KiB = 1,024 bytes (ESP32 flash and the app slot are sized in binary units), so 250 KiB is
      # 256,000 bytes. Set it below the measured difference to see the job fail.
      FLASH_BUDGET_KIB: 250
      # Static internal RAM limit in bytes (1 KiB), the same way.
      RAM_BUDGET_BYTES: 1024
    steps:
      # Toolchain setup (checkout through the penv pin) copied from ci.yml's build job.
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      # Same key as ci.yml's x4pro build, so both workflows share one package cache.
      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-v3-${{ runner.os }}-x4pro-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-v3-${{ runner.os }}-x4pro-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # The platform bootstraps ~/.platformio/penv with an open-ended "pioarduino>=6.1.19",
          # which resolves to a core whose tool-scons pin fights the platform's; keep the penv
          # core on the same version as the outer core installed above (see ci.yml).
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e x4pro
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build x4pro with games on
        id: build-on
        run: python3 scripts/check_flash_budget.py build on

      - name: Build x4pro with games off
        run: python3 scripts/check_flash_budget.py build off

      - name: Compare flash and static RAM
        run: |
          python3 scripts/check_flash_budget.py compare --limit-kib "$FLASH_BUDGET_KIB" \
            --ram-limit-bytes "$RAM_BUDGET_BYTES"

      # Needs only the games-on build, so it also reports when the games-off build or the comparison failed.
      - name: Check game objects
        if: ${{ !cancelled() && steps.build-on.outcome == 'success' }}
        run: python3 scripts/check_flash_budget.py objects

  x4pro-static-analysis:
    name: x4pro static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Toolchain setup (checkout through the penv pin) copied from the flash budget job.
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally (see the flash budget job).
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      # Same key as ci.yml's x4pro build and the flash budget job, so all three share one package cache.
      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-v3-${{ runner.os }}-x4pro-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-v3-${{ runner.os }}-x4pro-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # As in the flash budget job: keep the penv core on the outer core's version (see ci.yml).
          pio pkg install -e x4pro
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Install cppcheck runtime dependency
        run: |
          # pioarduino's Linux cppcheck binary links against libpcre.so.3 (as ci.yml's cppcheck job).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcre3

      - name: Run cppcheck on x4pro
        run: pio check -e x4pro --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  simulator-build:
    name: Simulator build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Toolchain setup as in the flash budget job, up to the platform: the simulator envs use the native platform,
      # so neither the espressif32 builder's Python packages nor the penv pin apply.
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      # Its own key: the x4pro key's cache must hold the espressif32 packages, which this job never installs.
      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-v3-${{ runner.os }}-simulator-${{ hashFiles('platformio.ini', '.claude/skills/run-crosshatch-player/simulator.ini') }}
          restore-keys: pio-v3-${{ runner.os }}-simulator-

      # The build prerequisites from the skill's SKILL.md; Xvfb, xdotool, and ImageMagick are only for running it.
      - name: Install simulator build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libssl-dev

      - name: Set up simulator envs
        run: .claude/skills/run-crosshatch-player/sim.sh setup

      - name: Build simulator_x4pro
        run: .claude/skills/run-crosshatch-player/sim.sh build x4pro

      - name: Build simulator_sticky
        run: .claude/skills/run-crosshatch-player/sim.sh build sticky

  fork-script-tests:
    name: Fork script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The tests need neither history nor the submodule: they build their own throwaway repositories.
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Each file in its own process, so one file's environment changes cannot leak into another, and every file runs
      # even after one fails. Standard library and git only, as docs/crosshatch/fork-scripts.md requires. Each file's
      # output is captured and must report "Ran <n> tests" with n > 0: a file that forgets unittest.main() exits 0
      # having run nothing (retro F7).
      - name: Run every scripts/*_test.py
        run: |
          status=0
          found=0
          log="$(mktemp)"
          for test in scripts/*_test.py; do
            [ -f "$test" ] || continue
            found=1
            echo "::group::$test"
            if python3 "$test" -v >"$log" 2>&1; then code=0; else code=$?; fi
            cat "$log"
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              status=1
              echo "::error::$test failed ($code)"
            elif ! grep -Eq '^Ran [1-9][0-9]* tests? in ' "$log"; then
              status=1
              echo "::error::$test ran no tests (no \"Ran <n> tests\" line with n > 0); does it call unittest.main()?"
            fi
          done
          rm -f "$log"
          if [ "$found" -eq 0 ]; then
            echo "::error::no scripts/*_test.py found"
            exit 1
          fi
          exit "$status"

  api-freeze:
    name: API freeze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the check compares the PR with its merge-base with the base branch.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check the frozen API levels
        run: python3 scripts/check_api_freeze.py --base-ref "origin/$GITHUB_BASE_REF"

  layer-check:
    name: Layer check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Reads only the working tree: neither history nor the submodule (SDK headers are classified by name).
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Check the game code's include edges
        run: python3 scripts/check_layers.py

  icons-up-to-date:
    name: Icons up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Reads only assets/game-icons, scripts, and the committed header and reference: neither history nor the submodule.
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # The generator writes to the runner's temp folder, so the committed header is compared, never rewritten. The
      # annotation carries cmp's first difference (or its EOF or missing-file line); the diff is capped because the
      # header is mostly rows of hex bytes.
      - name: Regenerate the icon header and its host-test reference and compare them with the committed ones
        run: |
          fresh="$RUNNER_TEMP/GameIcons.generated.h"
          fresh_raw="$RUNNER_TEMP/GameIconsRaw.h"
          # Exit 3 (PIN_MISMATCH) alone means the SVGs and SHA256SUMS disagree, so only it gets re-pin advice.
          if python3 scripts/gen_game_icons.py --out "$fresh" --raw-out "$fresh_raw"; then code=0; else code=$?; fi
          if [ "$code" -eq 3 ]; then
            echo "::error::scripts/gen_game_icons.py found the SVGs and assets/game-icons/SHA256SUMS disagreeing (exit 3; its message above names the file); restore an edited SVG from Phosphor 2.1.1, or, after a deliberate change of source (an icon added, removed, or updated), rewrite SHA256SUMS with python3 scripts/gen_game_icons.py --write-sums"
            exit 1
          elif [ "$code" -ne 0 ]; then
            echo "::error::scripts/gen_game_icons.py failed with exit $code (its message is above)"
            exit 1
          fi
          stale=0
          same() { # $1 the committed file, $2 a fresh run's
            if difference=$(cmp "$1" "$2" 2>&1); then return 0; fi
            echo "::error file=$1::differs from a fresh run of scripts/gen_game_icons.py ($difference); run python3 scripts/gen_game_icons.py --raw-out test/game_script/GameIconsRaw.h on Linux (it writes lib/GameIcons/GameIcons.generated.h by default) and commit both files"
            echo "diff -u of $1 and the fresh run, first 200 lines:"
            diff -u "$1" "$2" | head -n 200 || true
            stale=1
          }
          same lib/GameIcons/GameIcons.generated.h "$fresh"
          same test/game_script/GameIconsRaw.h "$fresh_raw"
          if [ "$stale" -ne 0 ]; then
            exit 1
          fi
          echo "lib/GameIcons/GameIcons.generated.h and test/game_script/GameIconsRaw.h match a fresh run of scripts/gen_game_icons.py"

  # The one fork-only check branch protection requires, like upstream's Test Status: jobs can be added, renamed,
  # or split here without changing the repository settings.
  crosshatch-test-status:
    name: Crosshatch Test Status
    needs:
      - upstream-ledger
      - flash-budget
      - x4pro-static-analysis
      - simulator-build
      - fork-script-tests
      - api-freeze
      - layer-check
      - icons-up-to-date
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok). A push cancels the run of the commit it
        # supersedes (cancel-in-progress), so a cancelled job passes with a notice when this run's commit is no longer
        # the PR's head; on the head a cancelled job still fails.
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$FAILED" = true ]; then
            exit 1
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          if [ -n "$head" ] && [ -n "$RUN_SHA" ] && [ "$head" != "$RUN_SHA" ]; then
            echo "::notice::$RUN_SHA is no longer the PR's head ($head); its cancelled jobs do not fail this check."
            exit 0
          fi
          exit 1
      - name: Success
        run: exit 0
